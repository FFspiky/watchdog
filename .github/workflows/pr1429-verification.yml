name: PR 1429 platform verification

on:
  push:
    branches: [ci/pr-1429-windows-20261110]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ['3.11', '3.12', '3.13', '3.13t', '3.14', '3.14t', '3.15', '3.15t']
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - name: Checkout the PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bfca719acaa86f56b8734629bf4904b1de3a9336
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
      - name: Install dependencies
        run: python -m pip install tox tox-uv
      - name: Run the full test suite
        run: python -m tox -q -e py
